<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareNest</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-page {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff7ff, #f0faf5);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: white;
            border: 1px solid #e8eef2;
            border-radius: 24px;
            box-shadow: 0 15px 45px #263b4a0d;
        }

        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading h1 {
            margin: 12px 0;
            font-family: 'Manrope', sans-serif;
            font-size: 32px;
            color: #263b4a;
        }

        .login-heading p {
            color: #718391;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-form label {
            font-size: 13px;
            font-weight: 700;
            color: #263b4a;
        }

        .login-form input,
        .login-form select {
            width: 100%;
            margin-top: 7px;
            padding: 13px;
            border: 1px solid #dfe8ee;
            border-radius: 10px;
            background: #fcfdff;
            color: #263b4a;
            font: inherit;
            font-size: 13px;
            outline: none;
        }

        .login-form input:focus,
        .login-form select:focus {
            border-color: #65a9e8;
            box-shadow: 0 0 0 3px #65a9e81a;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #718391;
        }

        .remember-option input {
            width: auto;
            margin: 0;
            accent-color: #2f6fa8;
        }

        .forgot-password {
            color: #2f6fa8;
            font-weight: 600;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: #2f6fa8;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #245982;
        }

        .login-message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            background: #eff7ff;
            color: #2f6fa8;
            font-size: 13px;
            line-height: 1.6;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            color: #718391;
            font-size: 13px;
        }

        .login-footer a {
            color: #2f6fa8;
            font-weight: 700;
        }

        .back-home {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #718391;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            .login-heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <section class="login-page">

        <div class="login-container">

            <div class="login-logo">
                <a href="index.html" class="logo">
                    <span class="logo-icon">✚</span>
                    CareNest
                </a>
            </div>

            <div class="login-heading">

                <span class="eyebrow">WELCOME BACK</span>

                <h1>Good to see you.</h1>

                <p>Log in to continue your healthcare journey.</p>

            </div>

            <form class="login-form" id="loginForm">

                <div>
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div>
                    <label for="role">Login As</label>
                    <select id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="accountant">Accountant</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="login-options">

                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="forgot-password.html" class="forgot-password">
                        Forgot password?
                    </a>

                </div>

                <div class="login-message" id="loginMessage"
                     role="status" aria-live="polite"></div>

                <p style="font-size:12px;color:#64748b;margin:8px 0;">Patient accounts use the local backend. Doctor and Admin dashboards are demonstration pages only.</p>
                <button type="submit" class="login-submit">
                    Log In →
                </button>

            </form>

            <div class="login-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </div>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

    <script src="login.js"></script>

</body>

</html>
